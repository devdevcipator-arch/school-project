<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Project — Coming Soon</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #1d2433;
      --muted: #5b6474;
      --accent: #2f6fde;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --text: #eef1f6;
        --muted: #9aa3b2;
        --accent: #6c9cff;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 20px 0 12px;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">School Project</span>
    <h1>Coming Soon</h1>
    <p>We're working on something great. Stay tuned!</p>
  </main>
</body>
</html>
